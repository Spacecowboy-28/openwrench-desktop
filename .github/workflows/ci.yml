name: Desktop foundation

on:
  push:
    branches: [main, 'dev/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Linux GUI libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libdbus-1-3
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m build
      - run: python scripts/build_desktop.py
      - name: Linux packaged launch
        if: runner.os == 'Linux'
        run: ./dist/OpenWrench/OpenWrench --smoke-test --data-dir "$RUNNER_TEMP/openwrench-smoke"
      - name: Windows packaged launch
        if: runner.os == 'Windows'
        run: |
          & ./dist/OpenWrench/OpenWrench.exe --smoke-test --data-dir "$env:RUNNER_TEMP/openwrench-smoke"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Binary distribution is gated on the milestone-6 license/source audit,
      # native installation tests, signing decision, and user release approval.
      - uses: actions/upload-artifact@v4
        with:
          name: source-packages-${{ runner.os }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
